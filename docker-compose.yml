version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: webrtc-audio-streamer:latest
    container_name: webrtc-audio-streamer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=change_this_secret_in_production
      - ADMIN_PASSWORD=admin_password_change_me
    volumes:
      - app-data:/app/server/data
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: webrtc-audio-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data

volumes:
  app-data:
  redis-data:
